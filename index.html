<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بینەری تەشکیلەی تۆپی پێ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>دیزاین و بینەری تەشکیلەکان</h1>
        <p>تەشکیلەیەک هەڵبژێرە تاوەکو جێگەی یاریزانەکان لەسەر یارگا ببێنیت</p>
    </header>

    <main class="main-container">
        <!-- بەشی دوگمەکانی تەشکیلە -->
        <div class="controls">
            <button class="btn" onclick="setFormation('433')">تەشکیلەی 3-3-4</button>
            <button class="btn" onclick="setFormation('4231')">تەشکیلەی 1-3-2-4</button>
            <button class="btn" onclick="setFormation('352')">تەشکیلەی 2-5-3</button>
        </div>

        <!-- یارگای تۆپی پێ -->
        <div class="pitch" id="pitch">
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line half-line"></div>
            <div class="pitch-line penalty-area top"></div>
            <div class="pitch-line penalty-area bottom"></div>

            <!-- ١١ یاریزانەکە لێرەدا دەبن -->
            <div class="player gk" id="p1"><span>GK</span></div>
            <div class="player def" id="p2"><span>LB</span></div>
            <div class="player def" id="p3"><span>CB</span></div>
            <div class="player def" id="p4"><span>CB</span></div>
            <div class="player def" id="p5"><span>RB</span></div>
            <div class="player mid" id="p6"><span>CM</span></div>
            <div class="player mid" id="p7"><span>CM</span></div>
            <div class="player mid" id="p8"><span>CAM</span></div>
            <div class="player fwd" id="p9"><span>LW</span></div>
            <div class="player fwd" id="p10"><span>ST</span></div>
            <div class="player fwd" id="p11"><span>RW</span></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
